<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 일정 노트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#2f3437;--mute:#8b8f93;--line:#e9e9e7;--hover:#f1f1ef;--card:#fff;--todo:#e3e2e0;--doing:#d3e5ef;--done:#dbeddb;--red:#e03e3e;--phi:#fbe4e4;--pmid:#fdecc8;--plo:#e3e2e0;--tag:#e8deee;--accent:#2383e2;--accent-soft:#e7f3f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--fg:#e6e6e4;--mute:#8f9296;--line:#33332f;--hover:#262625;--card:#202020;--todo:#3b3b39;--doing:#1f3a4d;--done:#1f3d2a;--phi:#5c2b29;--pmid:#56452a;--plo:#3b3b39;--tag:#3f3548;--accent-soft:#1f2f3a}}
:root[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--mute:#8f9296;--line:#33332f;--hover:#262625;--card:#202020;--todo:#3b3b39;--doing:#1f3a4d;--done:#1f3d2a;--phi:#5c2b29;--pmid:#56452a;--plo:#3b3b39;--tag:#3f3548;--accent-soft:#1f2f3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:980px;margin:0 auto;padding:48px 24px 80px}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl{flex:1 1 200px;min-width:0;font-family:inherit;font-size:2.1rem;font-weight:700;line-height:1.3;border:0;background:none;padding:2px 6px;margin-left:-6px;border-radius:4px}
.ttl:hover{background:var(--hover)}
.emo{font-size:1.6rem;padding:2px 4px;border:0;background:none;cursor:pointer;border-radius:4px}
.sub{color:var(--mute);margin:0 0 4px}
.theme{display:flex;gap:6px;align-items:center;margin:6px 0 24px;color:var(--mute);font-size:.85rem}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer}
.sw[aria-pressed=true]{border-color:var(--fg)}
input,select,button,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
button{cursor:pointer}
button:hover{background:var(--hover)}
.ttl:hover,.emo:hover{background:var(--hover)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(.92);background:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
.quick input[type=text]{flex:1 1 200px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filters input{flex:1 1 180px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{border:0;border-radius:4px 4px 0 0;color:var(--mute);background:none;padding:8px 12px}
.tab[aria-selected=true]{color:var(--fg);box-shadow:inset 0 -2px var(--accent)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:700px){.board{grid-template-columns:1fr}main{padding-top:28px}}
.col h2{font-size:.95rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.badge{padding:1px 10px;border-radius:3px;font-size:.85rem;font-weight:500}
.count{color:var(--mute);font-weight:400}
.task{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.task:hover{background:var(--hover)}
.task .body{flex:1;min-width:0}
.task .t{font-weight:500;word-break:break-word}
.chk{padding:0;width:20px;height:20px;border-radius:50%;flex:none;margin-top:3px;line-height:1;font-size:.7rem}
.chk[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--mute);margin-top:2px}
.late{color:var(--red)}
.pill{padding:0 8px;border-radius:3px;font-size:.78rem;color:var(--fg)}
.done .t{text-decoration:line-through;color:var(--mute)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:400;font-size:.9rem}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
.empty{color:var(--mute);padding:8px 2px}
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calbar h2{margin:0;font-size:1.1rem;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:92px;padding:4px;overflow:hidden}
.cal .dow{min-height:0;text-align:center;color:var(--mute);font-size:.85rem;padding:4px}
.cal .day{cursor:pointer}
.cal .day:hover{background:var(--hover)}
.cal .off{opacity:.45}
.cal .num{font-size:.8rem;color:var(--mute);display:inline-block;min-width:22px;text-align:center;border-radius:11px}
.cal .today .num{background:var(--accent);color:#fff}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:3px;padding:1px 6px;margin-top:3px;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--todo);color:var(--fg)}
.chip.s1{background:var(--doing)}
.chip.s2{background:var(--done);text-decoration:line-through}
.chip.c{background:color-mix(in srgb,var(--c) 32%,var(--card));box-shadow:inset 4px 0 0 var(--c)}
.cpick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cpick button{width:28px;height:28px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--c)}
.cpick button.none{background:var(--card);font-size:.75rem;width:auto;border-radius:14px;padding:0 10px;color:var(--mute)}
.cpick button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--card) inset}
.more{font-size:.75rem;color:var(--mute);padding-left:6px}
.dh{display:flex;align-items:center;justify-content:space-between}
.mb{border:0;background:none;padding:0 3px;font-size:1.05rem;line-height:1.4;opacity:.35;border-radius:4px}
.mb.has{opacity:1}
.mb:hover{opacity:1;background:var(--hover)}
.moodbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:16px}
.moodbar .lbl{color:var(--mute);font-size:.9rem;margin-right:4px}
.moodpick{display:flex;gap:6px;flex-wrap:wrap}
.moodbar .moodpick{margin-top:0}
.mood{display:inline-flex;flex-direction:column;align-items:center;padding:4px 10px;border-radius:6px;font-size:1.4rem;line-height:1.3}
.mood small{font-size:.7rem;color:var(--mute)}
.mood[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.msum{color:var(--mute);font-size:.85rem;margin:10px 0 0}
.entry{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.entry:hover{background:var(--hover)}
.entry .em{font-size:1.6rem;line-height:1.2}
.entry .tx{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.col{padding:8px;border-radius:8px;min-height:140px}
.col.over{background:var(--accent-soft);outline:2px solid var(--accent)}
.task[draggable]{cursor:grab}
.task.dragging{opacity:.45}
.mchart{margin-top:28px;position:relative}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.mchart h3{margin:0;font-size:1rem}
.msub{margin:0;color:var(--mute);font-size:.85rem}
.mchart table{min-width:0}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:10px;min-height:32px;padding:0 4px;border-radius:4px}
.mrow:hover{background:var(--hover)}
.mlab{white-space:nowrap}
.mtrack{display:flex;align-items:center;gap:8px;height:24px;border-left:1px solid var(--line)}
.mbar{flex:none;height:16px;width:calc((100% - 44px)*var(--p));background:var(--accent);border-radius:0 4px 4px 0}
.mval{font-size:.85rem}
.mrow:hover .mbar,.mrow:focus-visible .mbar{filter:brightness(1.15)}
.mtip{position:absolute;z-index:5;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:.85rem;white-space:nowrap}
.mtip[hidden]{display:none}
.mtip strong{display:block;font-size:1rem;font-weight:700}
.mtip span{color:var(--mute)}
[hidden]{display:none!important}
.lockbox{border:1px solid var(--line);border-radius:6px;padding:28px 16px;text-align:center;color:var(--mute)}
.lockbox p{margin:0 0 12px}
#lmanageBox{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media(max-width:700px){.cal>div{min-height:64px;padding:2px}.chip{font-size:.7rem;padding:0 3px}}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 2px}
dialog input,dialog select,dialog textarea{width:100%}
dialog textarea{min-height:90px;resize:vertical}
.dbtn{display:flex;gap:8px;margin-top:16px}
.dbtn .sp{flex:1}
.del{color:var(--red)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="head">
  <select class="emo" id="emoji" aria-label="아이콘 바꾸기"></select>
  <input class="ttl" id="pageTitle" aria-label="페이지 제목" maxlength="40">
</div>
<p class="sub" id="today"></p>
<div class="theme" id="theme"><span>포인트 색상</span></div>

<div class="moodbar" id="moodbar">
  <span class="lbl">오늘의 기분</span>
  <div class="moodpick" id="moodBtns" role="group" aria-label="오늘의 기분"></div>
  <button type="button" id="diaryToday">일기 쓰기</button>
  <button type="button" id="lockBtn">🔓 일기 잠금 설정</button>
</div>

<form class="quick" id="quick">
  <input type="text" id="qTitle" placeholder="할 일을 입력하세요" required aria-label="할 일">
  <input type="date" id="qDate" aria-label="날짜">
  <select id="qPri" aria-label="우선순위"><option>높음</option><option selected>보통</option><option>낮음</option></select>
  <button class="pri" type="submit">일정 추가</button>
</form>

<div class="filters">
  <input type="search" id="fq" placeholder="일정 검색" aria-label="일정 검색">
  <select id="ftag" aria-label="태그 필터"></select>
  <select id="fpri" aria-label="우선순위 필터"><option value="">모든 우선순위</option><option>높음</option><option>보통</option><option>낮음</option></select>
  <button type="button" id="freset">필터 초기화</button>
</div>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-v="cal">달력</button>
  <button class="tab" role="tab" aria-selected="false" data-v="board">보드</button>
  <button class="tab" role="tab" aria-selected="false" data-v="table">표</button>
  <button class="tab" role="tab" aria-selected="false" data-v="diary">일기</button>
</div>
<div id="view"></div>
</main>

<dialog id="dlg">
  <form id="df">
    <h2 id="dh" style="margin:0 0 4px;font-size:1.1rem">일정 자세히</h2>
    <label for="dTitle">이름</label><input type="text" id="dTitle" required>
    <label for="dDate">날짜</label><input type="date" id="dDate">
    <label for="dStatus">상태</label><select id="dStatus"><option>할 일</option><option>진행 중</option><option>완료</option></select>
    <label for="dPri">우선순위</label><select id="dPri"><option>높음</option><option>보통</option><option>낮음</option></select>
    <label id="dColL">색깔 (달력에 표시돼요)</label>
    <div class="cpick" id="dCol" role="group" aria-labelledby="dColL"></div>
    <label for="dTag">태그 (예: 시험, 과제)</label><input type="text" id="dTag" list="tagList" maxlength="20">
    <datalist id="tagList"></datalist>
    <label for="dMemo">메모</label><textarea id="dMemo"></textarea>
    <div class="dbtn">
      <button type="button" class="del" id="dDel">삭제</button>
      <span class="sp"></span>
      <button type="button" id="dCancel">닫기</button>
      <button type="submit" class="pri">저장</button>
    </div>
  </form>
</dialog>

<dialog id="ddlg">
  <form id="ddf">
    <h2 id="ddh" style="margin:0 0 4px;font-size:1.1rem">일기</h2>
    <label id="dMoodL">그날의 기분</label>
    <div class="moodpick" id="dMood" role="group" aria-labelledby="dMoodL"></div>
    <label for="dText">일기</label>
    <textarea id="dText" style="min-height:140px" placeholder="오늘 어땠는지 적어 보세요"></textarea>
    <div class="dbtn">
      <button type="button" class="del" id="ddDel">삭제</button>
      <span class="sp"></span>
      <button type="button" id="ddCancel">닫기</button>
      <button type="submit" class="pri">저장</button>
    </div>
  </form>
</dialog>

<dialog id="ldlg">
  <form id="lf">
    <h2 id="lh" style="margin:0 0 4px;font-size:1.1rem">일기 잠금</h2>
    <p id="lp" style="margin:0 0 4px;color:var(--mute);font-size:.9rem"></p>
    <div id="lcurBox"><label for="lCur" id="lCurL">비밀번호</label><input type="password" id="lCur" autocomplete="current-password"></div>
    <div id="lnewBox"><label for="lNew">새 비밀번호 (4자 이상)</label><input type="password" id="lNew" autocomplete="new-password"><label for="lNew2">새 비밀번호 확인</label><input type="password" id="lNew2" autocomplete="new-password"></div>
    <div id="lmanageBox"><button type="button" id="lLockNow">지금 잠그기</button><button type="button" id="lChange">비밀번호 바꾸기</button><button type="button" id="lRemove" class="del">잠금 해제하기</button></div>
    <p id="lerr" role="alert" style="color:var(--red);margin:8px 0 0;min-height:1.4em;font-size:.9rem"></p>
    <div class="dbtn">
      <button type="button" class="del" id="lForgot">비밀번호를 잊었어요</button>
      <span class="sp"></span>
      <button type="button" id="lCancel">닫기</button>
      <button type="submit" class="pri" id="lOk">확인</button>
    </div>
  </form>
</dialog>

<script>
var S=["할 일","진행 중","완료"],SC={"할 일":"var(--todo)","진행 중":"var(--doing)","완료":"var(--done)"};
var PC={"높음":"var(--phi)","보통":"var(--pmid)","낮음":"var(--plo)"};
var COLORS=[["파랑","#2383e2"],["초록","#0f9d58"],["주황","#d9730d"],["보라","#9065b0"],["분홍","#c14c8a"]];
var EMOJIS=["📅","📝","📚","✅","🌱","🚀","🎯","⭐"];
var MOODS=[["기쁨","😄"],["평온","😌"],["피곤","😴"],["슬픔","😢"],["화남","😡"]];
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(id){return document.getElementById(id)}

var now=new Date(),todayStr=ymd(now);
var tasks=ld("tasks",[]).map(function(t){t.priority=t.priority||"보통";t.tag=t.tag||"";t.memo=t.memo||"";return t});
var TC=[["빨강","#e0605a"],["주황","#f0953a"],["노랑","#e8c23c"],["초록","#4caf6a"],["파랑","#4a8fe0"],["보라","#9a6fd6"],["분홍","#e46aa0"]],tcol="";
var set=ld("settings",{title:"내 일정 노트",emoji:"📅",accent:"#2383e2"});
var view="cal",f={q:"",tag:"",pri:""},cal={y:now.getFullYear(),m:now.getMonth()},editId=null;
var diary=ld("diary",{}),dEditDate=null,dPick="";
var lockCfg=ld("lock",null),unlocked=false,afterUnlock=null,lockMode="";

function saveTasks(){sv("tasks",tasks)}
function applySettings(){
  document.documentElement.style.setProperty("--accent",set.accent);
  $("pageTitle").value=set.title;$("emoji").value=set.emoji;
  document.querySelectorAll(".sw").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-c")===set.accent)});
}
$("today").textContent="오늘은 "+now.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
$("qDate").value=todayStr;
$("emoji").innerHTML=EMOJIS.map(function(e){return"<option>"+e+"</option>"}).join("");
COLORS.forEach(function(c){var b=document.createElement("button");b.type="button";b.className="sw";b.style.background=c[1];b.setAttribute("data-c",c[1]);b.setAttribute("aria-label",c[0]);b.onclick=function(){set.accent=c[1];sv("settings",set);applySettings()};$("theme").appendChild(b)});
$("pageTitle").addEventListener("input",function(){set.title=this.value;sv("settings",set)});
$("emoji").addEventListener("change",function(){set.emoji=this.value;sv("settings",set)});

function tagsList(){var o={};tasks.forEach(function(t){if(t.tag)o[t.tag]=1});return Object.keys(o)}
function renderTags(){
  var l=tagsList();
  $("ftag").innerHTML='<option value="">모든 태그</option>'+l.map(function(t){return'<option value="'+esc(t)+'"'+(t===f.tag?" selected":"")+">#"+esc(t)+"</option>"}).join("");
  $("tagList").innerHTML=l.map(function(t){return'<option value="'+esc(t)+'">'}).join("");
}
function filtered(){
  var q=f.q.toLowerCase();
  return tasks.filter(function(t){
    if(f.tag&&t.tag!==f.tag)return false;
    if(f.pri&&t.priority!==f.pri)return false;
    if(q&&(t.title+" "+t.memo+" "+t.tag).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return(a.date||"9999").localeCompare(b.date||"9999")});
}
function meta(t){
  var late=t.date&&t.date<todayStr&&t.status!=="완료";
  var d=t.date?'<span class="'+(late?"late":"")+'">'+t.date+(t.date===todayStr?" (오늘)":"")+(late?" · 지남":"")+"</span>":"<span>날짜 없음</span>";
  return d+'<span class="pill" style="background:'+PC[t.priority]+'">'+t.priority+"</span>"+(t.tag?'<span class="pill" style="background:var(--tag)">#'+esc(t.tag)+"</span>":"")+(t.memo?"<span>📝</span>":"");
}
function chk(t){return'<button type="button" class="chk" data-toggle="'+t.id+'" aria-pressed="'+(t.status==="완료")+'" aria-label="완료 표시">'+(t.status==="완료"?"✓":"")+"</button>"}

function moodOf(ds){var e=diary[ds];if(!e||!e.mood)return null;for(var i=0;i<MOODS.length;i++)if(MOODS[i][0]===e.mood)return MOODS[i];return null}
function saveDiary(){sv("diary",diary)}
function setMood(ds,m){
  var e=diary[ds]||{mood:"",text:""};
  e.mood=(e.mood===m?"":m);
  if(!e.mood&&!e.text)delete diary[ds];else diary[ds]=e;
  saveDiary();render();
}
function renderMoodBar(){
  var cur=diary[todayStr]&&diary[todayStr].mood;
  $("moodBtns").innerHTML=MOODS.map(function(m){return'<button type="button" class="mood" data-m="'+m[0]+'" aria-pressed="'+(cur===m[0])+'" aria-label="'+m[0]+'">'+m[1]+"<small>"+m[0]+"</small></button>"}).join("");
}
var moodTable=false;
function moodChart(cnt){

  var h='<div class="mchart"><div class="mhead"><div><h3>'+(cal.m+1)+'월의 감정</h3><p class="msub">'+(total?"기록한 날 "+total+"일":"")+"</p></div>"+(total?'<button type="button" data-mtable="1">'+(moodTable?"그래프로 보기":"표로 보기")+"</button>":"")+"</div>";
  if(!total)return h+'<p class="empty">이 달에는 기록한 기분이 없어요. 날짜 칸 오른쪽 위의 ☺을 눌러 남겨 보세요.</p></div>';
  if(moodTable){
    h+='<div class="wrap"><table><thead><tr><th>감정</th><th>기록한 날</th><th>비율</th></tr></thead><tbody>'+MOODS.map(function(m){var c=cnt[m[0]]||0;return"<tr><td>"+m[1]+" "+m[0]+"</td><td>"+c+"일</td><td>"+Math.round(c/total*100)+"%</td></tr>"}).join("")+"</tbody></table></div>";
  }else{
    h+='<div class="mlist" role="list">'+MOODS.map(function(m,i){var c=cnt[m[0]]||0;return'<div class="mrow" role="listitem" tabindex="0" data-mi="'+i+'" data-c="'+c+'" aria-label="'+m[0]+" "+c+'일"><span class="mlab">'+m[1]+" "+m[0]+'</span><span class="mtrack"><span class="mbar" style="--p:'+(max?c/max:0)+'"></span><span class="mval">'+c+"</span></span></div>"}).join("")+'</div><div class="mtip" id="mtip" hidden></div>';
  }

}
function render(){
  renderTags();renderMoodBar();renderLockBtn();
  var l=filtered(),h="";
  if(view==="board"){
    h='<div class="board">'+S.map(function(s){
      var c=l.filter(function(t){return t.status===s});

        (c.length?c.map(function(t){return'<div class="task'+(s==="완료"?" done":"")+'" tabindex="0" draggable="true" data-open="'+t.id+'">'+chk(t)+'<div class="body"><div class="t">'+esc(t.title)+'</div><div class="meta">'+meta(t)+"</div></div></div>"}).join(""):'<div class="empty">비어 있어요</div>')+"</section>"}).join("")+"</div>";
  }else if(view==="table"){
    h=l.length?'<div class="wrap"><table><thead><tr><th></th><th>이름</th><th>날짜</th><th>상태</th><th>우선순위</th><th>태그</th></tr></thead><tbody>'+l.map(function(t){
      return'<tr tabindex="0" data-open="'+t.id+'" class="'+(t.status==="완료"?"done":"")+'"><td>'+chk(t)+'</td><td class="t">'+esc(t.title)+(t.memo?" 📝":"")+"</td><td>"+(t.date||"-")+'</td><td><span class="badge" style="background:'+SC[t.status]+'">'+t.status+'</span></td><td><span class="pill" style="background:'+PC[t.priority]+'">'+t.priority+"</span></td><td>"+(t.tag?"#"+esc(t.tag):"-")+"</td></tr>"}).join("")+"</tbody></table></div>":'<div class="empty">조건에 맞는 일정이 없어요.</div>';
  }else if(view==="diary"&&needUnlock()){
    h='<div class="lockbox"><p>🔒 일기가 잠겨 있어요.</p><button type="button" class="pri" data-unlock="1">잠금 해제</button></div>';
  }else if(view==="diary"){
    var q2=f.q.toLowerCase();
    var keys=Object.keys(diary).sort().reverse().filter(function(k){return!q2||(diary[k].text||"").toLowerCase().indexOf(q2)>=0});
    h=keys.length?keys.map(function(k){var m=moodOf(k),e=diary[k];return'<div class="entry" tabindex="0" data-diary="'+k+'"><div class="em">'+(m?m[1]:"📔")+'</div><div><div class="meta"><span>'+k+(m?" "+m[0]:"")+'</span></div><div class="tx">'+esc(e.text||"")+"</div></div></div>"}).join(""):'<div class="empty">아직 일기가 없어요. 위에서 오늘의 기분을 고르거나 "일기 쓰기"를 눌러 보세요.</div>';
  }else{
    var first=new Date(cal.y,cal.m,1),off=first.getDay(),days=new Date(cal.y,cal.m+1,0).getDate(),total=Math.ceil((off+days)/7)*7;
    var by={};l.forEach(function(t){if(t.date)(by[t.date]=by[t.date]||[]).push(t)});
    h='<div class="calbar"><button type="button" data-nav="-1" aria-label="이전 달">‹</button><h2>'+cal.y+"년 "+(cal.m+1)+'월</h2><button type="button" data-nav="0">오늘</button><button type="button" data-nav="1" aria-label="다음 달">›</button></div><div class="cal">'+
      ["일","월","화","수","목","금","토"].map(function(d){return'<div class="dow">'+d+"</div>"}).join("");
    for(var i=0;i<total;i++){
      var d=new Date(cal.y,cal.m,1-off+i),ds=ymd(d),inM=d.getMonth()===cal.m,list=by[ds]||[];
      h+='<div class="day'+(inM?"":" off")+(ds===todayStr?" today":"")+'" data-day="'+ds+'"><div class="dh"><span class="num">'+d.getDate()+'</span>'+(function(){var m=moodOf(ds);return'<button type="button" class="mb'+(m?" has":"")+'" data-diary="'+ds+'" aria-label="'+ds+' 기분과 일기">'+(m?m[1]:"☺")+"</button>"})()+"</div>"+
        list.slice(0,3).map(function(t){return'<button type="button" class="chip s'+S.indexOf(t.status)+(t.color?" c":"")+'"'+(t.color?' style="--c:'+esc(t.color)+'"':"")+' data-open="'+t.id+'">'+esc(t.title)+"</button>"}).join("")+
        (list.length>3?'<div class="more">+'+(list.length-3)+"개 더</div>":"")+"</div>";
    }
    h+="</div>";
    var cnt={},pre=cal.y+"-"+String(cal.m+1).padStart(2,"0");
    Object.keys(diary).forEach(function(k){if(k.indexOf(pre)===0&&diary[k].mood)cnt[diary[k].mood]=(cnt[diary[k].mood]||0)+1});
    h+=moodChart(cnt);
  }
  $("view").innerHTML=h;
}

function needUnlock(){return !!lockCfg&&!unlocked}
function renderLockBtn(){var b=$("lockBtn");if(!b)return;b.textContent=!lockCfg?"🔓 일기 잠금 설정":(unlocked?"🔒 잠금 관리":"🔒 잠겨 있음")}
function cyrb53(str,seed){var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
function pickAlgo(){return(window.crypto&&crypto.subtle)?"sha256":"basic"}
function hashPw(pw,salt,algo){
  var s=salt+":"+pw;
  if(algo==="sha256"){
    if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error("no crypto"));
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")});
  }
  return Promise.resolve(cyrb53(s,7));
}
function setPw(pw){
  var salt=Math.random().toString(36).slice(2)+Date.now().toString(36),algo=pickAlgo();
  return hashPw(pw,salt,algo).then(function(h){lockCfg={salt:salt,hash:h,algo:algo};sv("lock",lockCfg)});
}
function checkPw(pw){return hashPw(pw,lockCfg.salt,lockCfg.algo).then(function(h){return h===lockCfg.hash})}
function clearLock(){lockCfg=null;unlocked=false;try{localStorage.removeItem("lock")}catch(e){}}
function openLock(mode){
  lockMode=mode;
  var T={unlock:["일기 잠금 해제","비밀번호를 입력하면 일기를 볼 수 있어요."],set:["일기 잠금 설정","일기를 열 때마다 비밀번호를 물어봐요. 비밀번호를 잊으면 복구할 수 없고, 일기 내용을 지워야 잠금을 풀 수 있어요."],change:["비밀번호 바꾸기","현재 비밀번호와 새 비밀번호를 입력해 주세요."],remove:["잠금 해제하기","현재 비밀번호를 입력하면 잠금이 사라져요."],manage:["일기 잠금","지금은 잠금이 설정되어 있어요."]};
  $("lh").textContent=T[mode][0];$("lp").textContent=T[mode][1];$("lerr").textContent="";
  $("lCurL").textContent=mode==="change"?"현재 비밀번호":"비밀번호";
  $("lCur").value="";$("lNew").value="";$("lNew2").value="";
  $("lcurBox").hidden=!(mode==="unlock"||mode==="change"||mode==="remove");
  $("lnewBox").hidden=!(mode==="set"||mode==="change");
  $("lmanageBox").hidden=mode!=="manage";
  $("lForgot").hidden=mode!=="unlock";
  $("lOk").hidden=mode==="manage";
  $("lOk").textContent={unlock:"열기",set:"설정",change:"바꾸기",remove:"해제"}[mode]||"확인";
  if(!$("ldlg").open)$("ldlg").showModal();
  (mode==="set"?$("lNew"):mode==="manage"?$("lLockNow"):$("lCur")).focus();
}
function lockDone(){var fn=afterUnlock;afterUnlock=null;$("ldlg").close();render();if(fn)fn()}
$("lf").addEventListener("submit",function(e){
  e.preventDefault();
  function err(m){$("lerr").textContent=m}
  var cur=$("lCur").value,nw=$("lNew").value,nw2=$("lNew2").value;
  if(lockMode==="set"||lockMode==="change"){
    if(nw.length<4){err("비밀번호는 4자 이상으로 정해 주세요.");return}
    if(nw!==nw2){err("새 비밀번호가 서로 달라요.");return}
  }
  (lockMode==="set"?Promise.resolve(true):checkPw(cur)).then(function(ok){
    if(!ok){err("비밀번호가 맞지 않아요.");return}
    if(lockMode==="remove"){clearLock();lockDone();return}
    if(lockMode==="unlock"){unlocked=true;lockDone();return}
    return setPw(nw).then(function(){unlocked=true;lockDone()});
  }).catch(function(){err("이 브라우저에서는 비밀번호를 확인할 수 없어요.")});
});

function showTip(row,x){
  var tip=$("mtip");if(!tip)return;
  var box=tip.parentNode.getBoundingClientRect(),r=row.getBoundingClientRect();
  var m=MOODS[+row.getAttribute("data-mi")],c=+row.getAttribute("data-c"),total=0;
  document.querySelectorAll(".mrow").forEach(function(n){total+=+n.getAttribute("data-c")});
  tip.textContent="";
  var s=document.createElement("strong");s.textContent=c+"일 ("+Math.round(c/total*100)+"%)";
  var n=document.createElement("span");n.textContent=m[1]+" "+m[0];
  tip.appendChild(s);tip.appendChild(n);
  tip.hidden=false;
  var left=(x==null?r.left+r.width/2:x)-box.left+12;
  tip.style.left=Math.max(0,Math.min(left,box.width-tip.offsetWidth))+"px";
  tip.style.top=(r.top-box.top-tip.offsetHeight-4)+"px";
}
function hideTip(){var t=$("mtip");if(t)t.hidden=true}
function tipEvent(e){var row=e.target.closest&&e.target.closest(".mrow");if(row)showTip(row,e.clientX);else hideTip()}
